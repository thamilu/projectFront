<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Flagship promo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020" />
      <stop offset="1" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e" />
      <stop offset="1" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)" />
  <g opacity="0.18" fill="#ffffff">
    <circle cx="1020" cy="90" r="120" />
    <circle cx="1080" cy="250" r="170" />
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI" fill="#ffffff">
    <text x="70" y="140" font-size="44" font-weight="900">Flagship Savings</text>
    <text x="70" y="190" font-size="20" font-weight="500" opacity="0.86">Premium picks, verified sellers, and standout prices.</text>
    <rect x="70" y="230" width="320" height="54" rx="14" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.22" />
    <text x="96" y="265" font-size="18" font-weight="800">Browse featured products</text>
  </g>
  <g>
    <rect x="860" y="120" width="270" height="140" rx="18" fill="#0f172a" opacity="0.78" />
    <rect x="888" y="148" width="214" height="34" rx="10" fill="url(#chip)" opacity="0.95" />
    <text x="904" y="172" font-size="16" font-weight="800" fill="#0b1020" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI">Secure checkout</text>
    <rect x="888" y="198" width="214" height="10" rx="5" fill="#ffffff" opacity="0.20" />
    <rect x="888" y="222" width="168" height="10" rx="5" fill="#ffffff" opacity="0.16" />
  </g>
</svg>
